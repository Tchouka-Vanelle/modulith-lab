apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: shop
spec:
  replicas: 1 # Un volume ReadWriteOnce est monté par cette instance PostgreSQL.
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: db-credentials # POSTGRES_USER et POSTGRES_PASSWORD.
            - configMapRef:
                name: db-config # POSTGRES_DB (l'URL supplémentaire est inoffensive ici).
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata # Sous-dossier propre au volume.
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: shop
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
